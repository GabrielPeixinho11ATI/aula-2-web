<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja do Peixinho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css"> 
</head>
<body>
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-anchor"></i>
            <span>Loja do Peixinho</span>
        </div>
        <nav>
            <a href="/" class="active">Início</a>
            <a href="/cadastro">Novo Produto</a>
            <a href="/produtos">Estoque</a>
        </nav>
    </header>

    <div class="wave-header">
        <svg viewBox="0 0 1440 320">
            <path fill="#002244" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,154.7C384,149,480,107,576,96C672,85,768,107,864,128C960,149,1056,171,1152,165.3C1248,160,1344,128,1392,112L1440,96L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
        </svg>
    </div>

    <main>
        <div class="hero-section">
            <h2>Bem-vindo a Bordo! ⚓</h2>
            <p style="color: #64748b;">Gerencie seu estoque com agilidade e precisão.</p>
        </div>

        <div class="dashboard-grid">
            <div class="card-action highlight">
                <div class="icon-box">
                    <i class="fa-solid fa-box-open"></i>
                </div>
                <h3>Novo Produto</h3>
                <a href="/cadastro" class="btn btn-primary">Cadastrar Item</a>
            </div>

            <div class="card-action normal">
                <div class="icon-box">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
                <h3>Ver Estoque</h3>
                <a href="/produtos" class="btn btn-outline">Visualizar Lista</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Loja do Peixinho - Sistema de Gestão</p>
    </footer>
</body>
</html>
