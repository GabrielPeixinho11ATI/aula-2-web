<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Loja do Peixinho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-anchor"></i>
            <span>Loja do Peixinho</span>
        </div>
        <nav>
            <a href="/">Início</a>
            <a href="/cadastro" class="active">Novo Produto</a>
            <a href="/produtos">Estoque</a>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <div class="form-title">
                <h2><i class="fa-solid fa-plus-circle"></i> Novo Item</h2>
                <p style="color: #64748b;">Preencha os dados abaixo</p>
            </div>

            <form action="/salvar-produto" method="POST">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-tag"></i>
                        <input type="text" name="nome" placeholder="Ex: Ração Premium" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Preço (R$)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-dollar-sign"></i>
                        <input type="number" name="preco" step="0.01" placeholder="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <div class="input-wrapper">
                        <textarea name="descricao" rows="3" placeholder="Detalhes do item..."></textarea>
                        <i class="fa-solid fa-align-left"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    Salvar Produto
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Loja do Peixinho</p>
    </footer>
</body>
</html>
